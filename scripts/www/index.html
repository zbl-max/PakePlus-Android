/* 自动撮合引擎 */
function runMatching(){
  var d=db();
  var actives=d.members.filter(function(x){return x.status==='active';});
  var isActive=function(id){return actives.some(function(x){return x.id===id;});};
  var supplies=d.items.filter(function(x){return x.type==='supply'&&x.status==='on';});
  var demands=d.items.filter(function(x){return x.type==='demand'&&x.status==='on';});
  var created=0;
  demands.forEach(function(dem){
    if(!isActive(dem.memberId))return;
    supplies.forEach(function(sup){
      if(sup.memberId===dem.memberId)return;
      if(!isActive(sup.memberId))return;
      if(dem.category!==sup.category)return;
      var shared=dem.tags.filter(function(t){return sup.tags.indexOf(t)>-1;});
      if(!shared.length)return;
      var dup=d.matches.some(function(x){return x.demandItemId===dem.id&&x.supplyItemId===sup.id;});
      if(dup)return;
      var score=Math.min(100,60+10*shared.length);
      d.matches.push({id:uid('m'),demandItemId:dem.id,supplyItemId:sup.id,demandMemberId:dem.memberId,supplyMemberId:sup.memberId,category:dem.category,score:score,status:'new',createdAt:new Date().toISOString(),summary:dem.title+' ⇄ '+sup.title});
      created++;
    });
  });
  if(created)save(d);
  return created;
}

function makeContract(x){
  var d=db();
  var dm=byId(x.demandMemberId),sm=byId(x.supplyMemberId);
  var di=d.items.find(function(i){return i.id===x.demandItemId;}),si=d.items.find(function(i){return i.id===x.supplyItemId;});
  return{id:'c_'+uid('x').slice(2),content:makeContractText(x,dm,sm,di,si),version:1,updatedAt:new Date().toISOString()};
}
function makeContractText(x,dm,sm,di,si){
  var no=String(x.id).replace(/[^0-9a-z]/gi,'').toUpperCase().slice(-8)||'00000000';
  var L=[];
  L.push('商会会员撮合交易合同'); L.push('合同编号：HT-'+no); L.push('');
  L.push('甲方（需求方）：'+(dm?dm.name:'')+'（'+(dm?dm.company:'')+'）');
  L.push('乙方（供给方）：'+(sm?sm.name:'')+'（'+(sm?sm.company:'')+'）'); L.push('');
  L.push('一、交易内容'); L.push('经商会平台智能撮合，双方就以下供需信息达成合作意向：');
  L.push('  需求：'+(di?di.title:'')+'；供给：'+(si?si.title:'')+'。');
  L.push('二、双方确认'); L.push('甲乙双方已通过商会撮合平台分别确认本次交易，确认时间以平台记录为准。');
  L.push('三、履约约定'); L.push('双方应本着诚实信用原则履行合作内容，具体条款由双方另行协商签订正式合同。');
  L.push('四、平台说明'); L.push('本合同由商会会员撮合平台根据双方确认自动生成，供双方存档备查。'); L.push('');
  L.push('甲方确认：________　乙方确认：________');
  L.push('商会见证：________　日期：'+new Date().toISOString().slice(0,10));
  return L.join('\n');
}
function saveContract(matchId,content){
  var d=db(); var x=d.matches.find(function(y){return y.id===matchId;});
  if(!x)return{ok:false,msg:'撮合不存在'};
  if(!content||!content.trim())return{ok:false,msg:'合同内容不能为空'};
  if(!x.contract)x.contract={};
  x.contract.content=content; x.contract.version=(x.contract.version||0)+1; x.contract.updatedAt=new Date().toISOString();
  save(d);
  return{ok:true,msg:'合同已修改，将同步到交易双方账号中'};
}
/* 联系请求 */
function sendReq(fromId,itemId,message){
  var d=db();
  if(!message)return{ok:false,msg:'请填写咨询内容'};
  var it=d.items.find(function(x){return x.id===itemId;});
  if(!it)return{ok:false,msg:'供需信息不存在'};
  var toId=it.memberId;
  if(toId===fromId)return{ok:false,msg:'不能联系自己发布的信息'};
  d.requests.unshift({id:uid('r'),fromMemberId:fromId,toMemberId:toId,itemId:itemId,message:message,status:'pending',createdAt:new Date().toISOString()});
  save(d);
  return{ok:true,msg:'已提交联系请求，会长核实后将为您转达联系方式'};
}
function markReqDone(id){ var d=db(); var r=d.requests.find(function(x){return x.id===id;}); if(!r)return{ok:false,msg:'请求不存在'}; r.status='done'; save(d); return{ok:true,msg:'已处理该请求'}; }
function pendingPresReq(){ return db().requests.filter(function(x){return x.status==='pending';}).length; }
/* 首页内容 */
function saveHome(payload){ var d=db(); if(payload&&Array.isArray(payload.banners))d.home.banners=payload.banners; if(payload&&typeof payload.intro==='string')d.home.intro=payload.intro; save(d); return{ok:true,msg:'首页内容已保存'}; }
function saveActivity(f){
  var d=db();
  if(!f.title||!f.time||!f.location)return{ok:false,msg:'请填写活动标题、时间与地点'};
  var quota=parseInt(f.quota,10);
  if(!quota||quota<1||quota>10000)return{ok:false,msg:'请填写有效的人数上限（1-10000）'};
  if(f.id){ var a=d.home.activities.find(function(x){return x.id===f.id;}); if(a){ a.title=f.title; a.desc=f.desc||''; a.time=f.time; a.location=f.location; a.quota=quota; save(d); return{ok:true,msg:'活动已更新'}; } }
  d.home.activities.unshift({id:uid('a'),title:f.title,desc:f.desc||'',time:f.time,location:f.location,quota:quota,joined:[],cancelled:[],status:'open',createdAt:new Date().toISOString()});
  save(d);
  return{ok:true,msg:'活动已发布'};
}
function delActivity(id){ var d=db(); d.home.activities=d.home.activities.filter(function(x){return x.id!==id;}); save(d); }
function joinActivity(id,memberId){
  var d=db(); var a=d.home.activities.find(function(x){return x.id===id;});
  if(!a)return{ok:false,msg:'活动不存在'};
  a.cancelled=a.cancelled||[];
  if(a.cancelled.indexOf(memberId)>-1)return{ok:false,msg:'活动报名后取消就不能再参加了'};
  if(a.joined.indexOf(memberId)>-1)return{ok:false,msg:'您已参加该活动，无需重复报名'};
  if(a.joined.length>=a.quota)return{ok:false,msg:'活动名额已满，请关注下期活动'};
  a.joined.push(memberId); save(d);
  return{ok:true,msg:'报名成功，活动当天请准时参加'};
}
function leaveActivity(id,memberId){
  var d=db(); var a=d.home.activities.find(function(x){return x.id===id;});
  if(!a)return{ok:false,msg:'活动不存在'};
  a.cancelled=a.cancelled||[];
  var i=a.joined.indexOf(memberId);
  if(i===-1)return{ok:false,msg:'您尚未报名该活动'};
  a.joined.splice(i,1);
  if(a.cancelled.indexOf(memberId)===-1)a.cancelled.push(memberId);
  save(d);
  return{ok:true,msg:'已取消报名，取消后不能再参加该活动'};
}

function toast(msg, ms) { var t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:200;background:rgba(23,29,44,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;max-width:76%;text-align:center;transition:opacity .3s;'; document.body.appendChild(t); } t.textContent = msg; t.style.opacity = '1'; clearTimeout(t._tm); t._tm = setTimeout(function () { t.style.opacity = '0'; }, ms || 2200); }
function overlay(title, html, footHtml) {
  var m = document.getElementById('overlay');
  m.innerHTML = '<div class="overlay-body"><div class="overlay-head"><div class="overlay-title">' + title + '</div><button class="overlay-close" onclick="hideOverlay()">×</button></div><div class="overlay-content">' + html + '</div>' + (footHtml ? '<div class="overlay-foot">' + footHtml + '</div>' : '') + '</div>';
  m.classList.add('show');
}
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function badge(t, c) { return '<span class="badge ' + c + '">' + t + '</span>'; }

function go(view) {
  var ok = S.role ? true : (view === 'login');
  if (!ok) { S.role = ''; S.memberId = ''; }
  S.view = view;
  try { location.hash = view; } catch (e) {}
  render();
}
function back() {
  if(S.view==='m_activity')return go('m_home');
  if (location.hash) { try { history.back(); } catch (e) {} setTimeout(render, 30); }
  else go('login');
}
window.addEventListener('hashchange', function () {
  var v = location.hash.replace('#', '') || 'login';
  if (v !== S.view) { S.view = v; render(); }
});
function render() {
  if (S.view === 'login' || !S.view) { renderLogin(); return; }
  if (!S.role) {
    var sess = getSession();
    if (sess && sess.role) { S.role = sess.role; S.memberId = sess.memberId || ''; }
    else { go('login'); return; }
  }
  var allowed = true;
  if (S.role === 'president' && !/^p_/.test(S.view)) allowed = false;
  if (S.role === 'manager' && !/^mg_/.test(S.view)) allowed = false;
  if (S.role === 'member' && !/^m_/.test(S.view)) allowed = false;
  if (!allowed) { S.view = S.role === 'president' ? 'p_members' : (S.role === 'manager' ? 'mg_content' : 'm_home'); }
  renderTopbar();
  renderMain();
  renderTabbar();
}

function renderTopbar() {
  var v = S.view, title = VIEW_TITLE[v] || '';
  var right = '';
  var isTab = !!TAB_ROLE[v];
  if (v === 'login') right = '';
  else if (!isTab) right = '<button class="tb-btn" onclick="back()">‹</button>';
  else if (S.role === 'president') right = '<button class="tb-btn" onclick="presMenu()">⋯</button>';
  else if (S.role === 'member') right = '<button class="tb-btn" onclick="memMenu()">⋯</button>';
  else if (S.role === 'manager') right = '<button class="tb-btn primary" onclick="mgAdd()">＋</button>';
  app.innerHTML = '<div class="topbar"><div class="tt">' + title + '</div>' + right + '</div><div class="page ' + (isTab ? '' : 'page-no-tab') + '" id="page"></div>';
}
function renderTabbar() {
  var tabs = S.role === 'president' ? PRES_TABS : (S.role === 'manager' ? MG_TABS : MEM_TABS);
  var badgeKey = (S.role === 'president' && S.view === 'p_requests') ? pendingPresReq() : 0;
  var html = '<div class="tabbar">';
  tabs.forEach(function (t) {
    var on = t[0] === S.view ? ' on' : '';
    var red = '';
    if (t[0] === 'p_requests' && badgeKey > 0) red = '<span class="tab-badge">' + (badgeKey > 99 ? '99+' : badgeKey) + '</span>';
    html += '<div class="tab' + on + '" onclick="go(\'' + t[0] + '\')">' + red + '<span class="tab-pill">' + t[1] + '</span></div>';
  });
  html += '</div>';
  var old = document.querySelector('.tabbar'); if (old) old.remove();
  app.insertAdjacentHTML('beforeend', html);
}

function doExport() {
  var blob = new Blob([exportJSON()], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '商会会员撮合平台-备份-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('备份已导出，请选择保存位置');
}
function doImport(inp) {
  var file = inp.files && inp.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var r = importJSON(String(reader.result));
    toast(r.msg, 2800);
    if (r.ok) render();
  };
  reader.readAsText(file);
}

  var myId = S.memberId;
  var myState = cancelled.indexOf(myId) > -1 ? 'cancelled' : (joined.indexOf(myId) > -1 ? 'joined' : 'none');
  var stTxt = myState === 'joined' ? '<span class="badge b-confirmed">已报名</span>' : (myState === 'cancelled' ? '<span class="badge b-pending">已取消报名</span>' : (joined.length >= a.quota ? '<span class="badge b-done">已满员</span>' : '<span class="badge b-new">报名中</span>'));
  var roster = joined.map(function (mid) { var m = byId(mid); return m ? '<div class="roster-cell ' + (m.gender === '女士' ? 'm-female' : 'm-male') + '">' + esc(m.name) + '</div>' : ''; }).join('');
  var actions = '';
  if (myState === 'none' && joined.length < a.quota) actions = '<button class="btn btn-primary btn-block" onclick="actJoin(\'' + a.id + '\')">参加活动</button>';
  else if (myState === 'joined') actions = '<button class="btn btn-danger btn-block" onclick="actLeave(\'' + a.id + '\')">取消报名</button>';
  else if (myState === 'cancelled') actions = '<div class="cancelled-tip">活动报名后取消就不能再参加了</div>';
  else actions = '<div class="cancelled-tip">活动名额已满</div>';
  return '<div class="card"><div class="act-big-title">' + esc(a.title) + '</div>' +
    '<div class="act-state">' + stTxt + '<span class="act-count">' + joined.length + ' / ' + a.quota + ' 人</span></div>' +
    '<div class="act-row">时间：' + esc(a.time) + '</div><div class="act-row">地点：' + esc(a.location) + '</div>' +
    '<div class="act-desc">' + esc(a.desc) + '</div></div>' +
    '<div class="section-title">已报名会员（' + joined.length + '）</div><div class="roster-grid">' + roster + '</div>' +
    (joined.length === 0 ? '<div class="empty"><div class="t">还没有会员报名</div></div>' : '') +
    '<div class="act-actions">' + actions + '</div>';
}
function actJoin(id) { var r = joinActivity(id, S.memberId); toast(r.msg, 2600); render(); }
function actLeave(id) { var r = leaveActivity(id, S.memberId); toast(r.msg, 2600); render(); }
/* ================= 管理员端 ================= */
function mgAdd() {
  if (S.view === 'mg_activities') mgActEdit(null);
  else if (S.view === 'mg_content') mgBannerEdit(null);
}
function renderMgContent() {
  var d = db();
  var cards = d.home.banners.map(function (b) {
    return '<div class="card"><div class="b-preview"><div class="bt">' + esc(b.title) + '</div><div class="bs">' + esc(b.sub) + '</div></div>' +
      '<div class="b-ops"><button class="btn btn-ghost btn-sm" onclick="mgBannerEdit(\'' + b.id + '\')">编辑</button><button class="btn btn-danger btn-sm" onclick="mgBannerDel(\'' + b.id + '\')">删除</button></div></div>';
  }).join('');
  return '<div class="section-title">广告轮播（' + d.home.banners.length + '）</div>' + cards +
    (d.home.banners.length === 0 ? '<div class="empty"><div class="t">暂无轮播图</div></div>' : '') +
    '<div class="section-title">商会简介</div><div class="card"><textarea class="input" id="mg_intro" style="min-height:110px">' + esc(d.home.intro) + '</textarea>' +
    '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="mgSaveIntro()">保存简介</button></div>';
}
function mgSaveIntro() { var r = saveHome({ intro: document.getElementById('mg_intro').value }); toast(r.msg); }
function mgBannerEdit(id) {
  var d = db();
  var b = id ? d.home.banners.find(function (x) { return x.id === id; }) : null;
  overlay(id ? '编辑轮播' : '新增轮播',
    '<div class="field"><div class="label">轮播标题</div><input class="input" id="mb_title" value="' + (b ? esc(b.title) : '') + '"></div>' +
    '<div class="field"><div class="label">副标题</div><input class="input" id="mb_sub" value="' + (b ? esc(b.sub) : '') + '"></div>' +
    '<div class="overlay-foot"><button class="btn btn-ghost" onclick="hideOverlay()">取消</button><button class="btn btn-primary" onclick="mgBannerSave(\'' + (id || '') + '\')">保存</button></div>');
}
function mgBannerSave(id) {
  var v = function (x) { return document.getElementById(x).value; };
  var title = v('mb_title').trim();
  if (!title) { toast('请填写轮播标题'); return; }
  var banners = db().home.banners.slice();
  if (id) { var b = banners.find(function (x) { return x.id === id; }); if (b) { b.title = title; b.sub = v('mb_sub').trim(); } }
  else banners.push({ id: 'b' + Date.now().toString(36), img: '', title: title, sub: v('mb_sub').trim() });
  var r = saveHome({ banners: banners });
  toast(r.msg); if (r.ok) { hideOverlay(); render(); }
}
function mgBannerDel(id) {
  if (!confirm('确定删除该轮播图吗？')) return;
  var r = saveHome({ banners: db().home.banners.filter(function (x) { return x.id !== id; }) });
  toast(r.msg); render();
}
function renderMgActivities() {
  var d = db();
  var acts = d.home.activities.slice().sort(function (x, y) { return x.time < y.time ? -1 : 1; });
  var cards = acts.map(function (a) {
    var joined = a.joined || [];
    return '<div class="card"><div class="act-title-row"><div class="act-title">' + esc(a.title) + '</div><span class="act-count" style="font-size:12px;color:#e08a00;font-weight:700">' + joined.length + '/' + a.quota + ' 人</span></div>' +
      '<div class="act-line">时间：' + esc(a.time) + '</div><div class="act-line">地点：' + esc(a.location) + '</div>' +
      '<div class="act-line">取消报名：' + (a.cancelled || []).length + ' 人</div>' +
      '<div class="op-row"><button class="btn btn-ghost btn-sm" onclick="mgRoster(\'' + a.id + '\')">报名名单</button>' +
      '<button class="btn btn-primary-soft btn-sm" onclick="mgActEdit(\'' + a.id + '\')">编辑</button>' +
      '<button class="btn btn-danger btn-sm" onclick="mgActDel(\'' + a.id + '\')">删除</button></div></div>';
  }).join('');
  return cards + (acts.length === 0 ? '<div class="empty"><div class="t">暂无活动</div><div class="s">点击右上角「＋」新建活动邀请</div></div>' : '');
}
function mgActEdit(id) {
  var d = db();
  var a = id ? d.home.activities.find(function (x) { return x.id === id; }) : null;
  overlay(id ? '编辑活动' : '新建活动',
    '<div class="field"><div class="label">活动标题</div><input class="input" id="ma_title" value="' + (a ? esc(a.title) : '') + '"></div>' +
    '<div class="field"><div class="label">活动介绍</div><textarea class="input" id="ma_desc">' + (a ? esc(a.desc) : '') + '</textarea></div>' +
    '<div class="field"><div class="label">活动时间</div><input class="input" id="ma_time" value="' + (a ? esc(a.time) : '') + '" placeholder="如：2026-10-01 09:00"></div>' +
    '<div class="field"><div class="label">活动地点</div><input class="input" id="ma_loc" value="' + (a ? esc(a.location) : '') + '" placeholder="如：深圳市南山区科技园"></div>' +
    '<div class="field"><div class="label">人数上限</div><input class="input" type="number" id="ma_quota" value="' + (a ? a.quota : '') + '" placeholder="1-10000"></div>' +
    '<div class="overlay-foot"><button class="btn btn-ghost" onclick="hideOverlay()">取消</button><button class="btn btn-primary" onclick="mgActSave(\'' + (id || '') + '\')">保存</button></div>');
}
function mgActSave(id) {
  var v = function (x) { return document.getElementById(x).value; };
  var r = saveActivity({ id: id || '', title: v('ma_title').trim(), desc: v('ma_desc').trim(), time: v('ma_time').trim(), location: v('ma_loc').trim(), quota: v('ma_quota').trim() });
  toast(r.msg, 2600);
  if (r.ok) { hideOverlay(); render(); }
}
function mgActDel(id) {
  if (!confirm('确定删除该活动吗？删除后不可恢复。')) return;
  delActivity(id); render();
}
function mgRoster(id) {
  var a = db().home.activities.find(function (x) { return x.id === id; }); if (!a) return;
  var rows = (a.joined || []).map(function (mid) {
    var m = byId(mid);
    return m ? '<div class="rs-row"><div class="avatar avatar-sm ' + (m.gender === '女士' ? 'm-female' : 'm-male') + '">' + anonName(m) + '</div><div class="rs-name">' + esc(m.name) + '</div><div class="rs-phone">' + m.phone + '</div></div>' : '';
  }).join('');
  overlay('报名名单', '<div class="section-title" style="margin-top:0">' + esc(a.title) + '（' + (a.joined || []).length + ' 人）</div>' + rows +
    ((a.joined || []).length === 0 ? '<div class="empty"><div class="t">暂无会员报名</div></div>' : ''));
}
function renderMgPassword() {
  return '<div class="card"><div class="section-title" style="margin-top:0">修改密码</div><div class="login-tip">管理员修改密码需输入授权号</div>' +
    '<div class="field"><div class="label">授权号</div><input class="input" type="password" id="gp_auth" placeholder="请输入授权号"></div>' +
    '<div class="field"><div class="label">原密码</div><input class="input" type="password" id="gp_old" placeholder="请输入原密码"></div>' +
    '<div class="field"><div class="label">新密码</div><input class="input" type="password" id="gp_n1" placeholder="6-8 位，含大小写字母与数字"></div>' +
    '<div class="field"><div class="label">确认新密码</div><input class="input" type="password" id="gp_n2" placeholder="再次输入新密码"></div>' +
    '<button class="btn btn-primary btn-block" onclick="gpSubmit()">确认修改</button></div>';
}
function gpSubmit() {
  var v = function (x) { return document.getElementById(x).value; };
  var r = doChangePwd('manager', null, { auth: v('gp_auth').trim(), old: v('gp_old'), nw: v('gp_n1'), nw2: v('gp_n2') });
  toast(r.msg, 2600);
}
/* ================= 初始化 ================= */
document.body.insertAdjacentHTML('beforeend', '<div class="overlay-mask" id="overlay"></div>');
runMatching();
var sess = getSession();
if (sess && sess.role) { S.role = sess.role; S.memberId = sess.memberId || ''; }
var hv = location.hash.replace('#', '') || 'login';
S.view = (sess && sess.role) ? hv : 'login';
render();
</script>
